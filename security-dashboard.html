<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,700;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --gold:#C8A84B; --gold-light:#e0bf6a; --gold-dim:rgba(200,168,75,0.15);
  --black:#080808; --dark:#111; --card:#161616;
  --border:rgba(255,255,255,0.1); --text:#ffffff; --muted:rgba(255,255,255,0.42);
  --green:#6fcf8a; --green-dim:rgba(111,207,138,0.12); --green-border:rgba(111,207,138,0.25);
}
body { font-family:Montserrat,sans-serif; background:var(--black); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before { content:""; position:fixed; inset:0; background:radial-gradient(ellipse 70% 40% at 100% 0%,rgba(200,168,75,0.06) 0%,transparent 55%); pointer-events:none; z-index:0; }
@keyframes fadeUp  { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes spin    { to{transform:rotate(360deg)} }
@keyframes pulse   { 0%,100%{opacity:1} 50%{opacity:0.5} }
#login-screen { position:fixed; inset:0; background:var(--black); display:flex; align-items:center; justify-content:center; z-index:100; padding:24px; }
#login-screen.hidden { display:none; }
.login-box { background:var(--card); border:1px solid var(--border); border-radius:3px; padding:48px; width:100%; max-width:420px; text-align:center; animation:fadeUp 0.5s ease; }
.login-logo { width:280px; max-width:88%; display:block; margin:0 auto 20px; }
.login-divider { width:40px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto 22px; }
.login-sub { font-size:9px; color:var(--muted); letter-spacing:0.28em; text-transform:uppercase; margin-bottom:28px; }
.login-box input { width:100%; background:var(--dark); border:1px solid var(--border); border-radius:2px; padding:13px 16px; font-family:Montserrat,sans-serif; font-size:13px; color:#fff; outline:none; text-align:center; letter-spacing:0.2em; transition:border-color 0.2s; appearance:none; }
.login-box input:focus { border-color:var(--gold); }
.login-box input.invalid { border-color:rgba(220,80,80,0.5); }
.login-btn { width:100%; padding:13px; background:var(--gold); color:#000; border:none; border-radius:2px; font-family:Montserrat,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.35em; text-transform:uppercase; cursor:pointer; margin-top:14px; transition:background 0.2s; }
.login-btn:hover { background:var(--gold-light); }
.login-error { font-size:10px; color:#e07070; margin-top:12px; display:none; }
.login-error.show { display:block; }
#dashboard { position:relative; z-index:1; display:none; animation:fadeIn 0.4s ease; }
#dashboard.visible { display:block; }
.topbar { display:flex; align-items:center; justify-content:space-between; padding:10px 32px; border-bottom:1px solid var(--border); background:rgba(12,12,12,0.97); backdrop-filter:blur(8px); position:sticky; top:0; z-index:10; gap:16px; flex-wrap:wrap; }
.topbar-left { display:flex; align-items:center; gap:14px; }
.topbar-logo { height:42px; width:auto; display:block; }
.topbar-badge { font-size:8px; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; color:#000; background:var(--gold); padding:4px 10px; border-radius:2px; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.live-dot { display:flex; align-items:center; gap:8px; font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--green); }
.live-dot::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--green); display:inline-block; animation:pulse 2s ease infinite; }
.logout-btn { background:none; border:1px solid var(--border); color:var(--muted); font-size:8px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; padding:7px 14px; border-radius:2px; cursor:pointer; font-family:Montserrat,sans-serif; transition:all 0.2s; }
.logout-btn:hover { border-color:var(--gold); color:var(--gold); }
.main { max-width:1300px; margin:0 auto; padding:36px 32px 60px; }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:32px; }
.stat-card { background:var(--card); border:1px solid var(--border); border-radius:2px; padding:20px 22px; position:relative; overflow:hidden; }
.stat-card::after { content:""; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent); opacity:0.5; }
.stat-num { font-family:Cormorant Garamond,serif; font-size:2.8rem; font-weight:300; color:var(--gold); line-height:1; margin-bottom:6px; }
.stat-label { font-size:8px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:var(--muted); }
.controls { display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
.search-wrap { position:relative; flex:1; min-width:200px; }
.search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; pointer-events:none; }
.search-wrap input { width:100%; background:var(--card); border:1px solid var(--border); border-radius:2px; padding:12px 14px 12px 42px; font-family:Montserrat,sans-serif; font-size:12px; color:#fff; outline:none; transition:border-color 0.2s; appearance:none; }
.search-wrap input:focus { border-color:var(--gold); }
.filter-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); font-size:9px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; padding:12px 18px; border-radius:2px; cursor:pointer; font-family:Montserrat,sans-serif; transition:all 0.2s; white-space:nowrap; }
.filter-btn:hover, .filter-btn.active { border-color:var(--gold); color:var(--gold); background:var(--gold-dim); }
.refresh-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); font-size:16px; padding:12px 16px; border-radius:2px; cursor:pointer; transition:all 0.2s; line-height:1; }
.refresh-btn:hover { border-color:var(--gold); color:var(--gold); }
.refresh-btn.spinning { animation:spin 0.6s linear; }
.table-wrap { background:var(--card); border:1px solid var(--border); border-radius:2px; overflow:hidden; }
.table-head { display:grid; grid-template-columns:40px 1fr 150px 70px 110px 90px 190px; padding:13px 20px; border-bottom:1px solid var(--border); background:rgba(200,168,75,0.05); }
.th { font-size:8px; font-weight:700; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); }
.guest-row { border-bottom:1px solid rgba(255,255,255,0.05); transition:background 0.15s; }
.guest-row:last-child { border-bottom:none; }
.guest-row:hover { background:rgba(255,255,255,0.02); }
.guest-row.checked-in { background:rgba(111,207,138,0.03); }
.guest-main { display:grid; grid-template-columns:40px 1fr 150px 70px 110px 90px 190px; padding:14px 20px; align-items:center; }
.row-num { font-size:11px; color:var(--muted); }
.guest-name { font-size:13px; font-weight:400; color:#fff; }
.guest-email { font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.guest-party-size { font-size:11px; color:var(--muted); }
.guest-time { font-size:10px; color:var(--muted); }
.guest-actions { display:flex; align-items:center; gap:6px; }
.checkin-btn { font-family:Montserrat,sans-serif; font-size:8px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; padding:7px 10px; border-radius:2px; cursor:pointer; transition:all 0.2s; border:1px solid var(--border); background:none; color:var(--muted); white-space:nowrap; }
.checkin-btn:hover { border-color:var(--gold); color:var(--gold); background:var(--gold-dim); }
.checkin-btn.in { background:var(--green-dim); border-color:var(--green-border); color:var(--green); }
.pay-btn { font-family:Montserrat,sans-serif; font-size:8px; font-weight:700; letter-spacing:0.15em; text-transform:uppercase; padding:7px 10px; border-radius:2px; cursor:pointer; transition:all 0.2s; border:1px solid var(--border); background:none; color:var(--muted); white-space:nowrap; }
.pay-btn:hover { border-color:var(--gold); color:var(--gold); }
.pay-btn.cash { background:rgba(200,168,75,0.12); border-color:var(--gold); color:var(--gold); }
.pay-btn.card { background:var(--green-dim); border-color:var(--green-border); color:var(--green); }
.remove-btn { font-family:Montserrat,sans-serif; font-size:10px; font-weight:700; padding:6px 9px; border-radius:2px; cursor:pointer; transition:all 0.2s; border:1px solid rgba(220,80,80,0.25); background:none; color:rgba(220,80,80,0.5); line-height:1; }
.remove-btn:hover { border-color:rgba(220,80,80,0.7); color:rgba(220,80,80,0.9); background:rgba(220,80,80,0.08); }
.companions-list { padding:0 20px 12px 60px; }
.companion-item { display:flex; gap:12px; align-items:center; padding:6px 0; border-top:1px solid rgba(255,255,255,0.04); }
.companion-dot { width:5px; height:5px; border-radius:50%; background:var(--gold); opacity:0.4; flex-shrink:0; }
.companion-name { color:#fff; font-size:12px; min-width:130px; }
.companion-email { font-size:11px; color:var(--muted); flex:1; }
.empty-state { text-align:center; padding:70px 20px; color:var(--muted); }
.empty-icon { font-size:2rem; margin-bottom:14px; }
.empty-state p { font-size:11px; letter-spacing:0.15em; text-transform:uppercase; }
.loading-state { text-align:center; padding:50px 20px; color:var(--muted); }
.big-spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
.loading-state p { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; }
.table-footer { display:flex; align-items:center; justify-content:space-between; margin-top:14px; flex-wrap:wrap; gap:12px; }
.result-count, .last-refresh { font-size:10px; color:var(--muted); }
.clear-btn { background:none; border:1px solid rgba(220,80,80,0.25); color:rgba(220,80,80,0.6); font-size:8px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; padding:8px 16px; border-radius:2px; cursor:pointer; font-family:Montserrat,sans-serif; transition:all 0.2s; }
.clear-btn:hover { border-color:rgba(220,80,80,0.6); color:rgba(220,80,80,0.9); }
@media (max-width:1000px) { .stats-row{grid-template-columns:repeat(2,1fr);} .table-head,.guest-main{grid-template-columns:36px 1fr 70px 90px 190px;} .th:nth-child(3),.th:nth-child(5),.guest-email,.guest-time{display:none;} }
@media (max-width:560px) { .topbar{padding:12px 18px;} .main{padding:24px 18px 48px;} }

  .add-btn { background:var(--gold); border:none; color:#000; font-size:9px; font-weight:700; letter-spacing:0.25em; text-transform:uppercase; padding:12px 18px; border-radius:2px; cursor:pointer; font-family:Montserrat,sans-serif; transition:background 0.2s; white-space:nowrap; }
  .add-btn:hover { background:var(--gold-light); }
  .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; padding:24px; }
  .modal-overlay.visible { display:flex; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:3px; padding:36px; width:100%; max-width:440px; animation:fadeUp 0.3s ease; }
  .modal-title { font-family:Cormorant Garamond,serif; font-size:1.4rem; font-weight:300; letter-spacing:0.04em; margin-bottom:6px; }
  .modal-sub { font-size:10px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:28px; }
  .modal .field { margin-bottom:18px; }
  .modal label { display:block; font-size:9px; font-weight:600; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  .modal input { width:100%; background:var(--dark); border:1px solid var(--border); border-radius:2px; padding:12px 14px; font-family:Montserrat,sans-serif; font-size:13px; color:#fff; outline:none; transition:border-color 0.2s; appearance:none; }
  .modal input:focus { border-color:var(--gold); }
  .modal input.invalid { border-color:rgba(220,80,80,0.5); }
  .modal-actions { display:flex; gap:12px; margin-top:24px; }
  .modal-confirm { flex:1; padding:13px; background:var(--gold); color:#000; border:none; border-radius:2px; font-family:Montserrat,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; transition:background 0.2s; }
  .modal-confirm:hover { background:var(--gold-light); }
  .modal-cancel { flex:1; padding:13px; background:none; color:var(--muted); border:1px solid var(--border); border-radius:2px; font-family:Montserrat,sans-serif; font-size:9px; font-weight:700; letter-spacing:0.3em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; }
  .modal-cancel:hover { border-color:var(--gold); color:var(--gold); }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <img class="login-logo" src="https://i.imgur.com/1n4A9HH.png" alt="WTF(x)?">
    <div class="login-divider"></div>
    <div class="login-sub">Security Access - Staff Only</div>
    <input type="password" id="pwd-input" placeholder="Enter passcode" maxlength="20">
    <button class="login-btn" id="login-btn">Unlock Dashboard</button>
    <div class="login-error" id="login-error">Incorrect passcode. Please try again.</div>
  </div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <img class="topbar-logo" src="https://i.imgur.com/1n4A9HH.png" alt="WTF(x)?">
      <span class="topbar-badge">Security</span>
    </div>
    <div class="topbar-right">
      <span class="live-dot">Live</span>
      <button class="logout-btn" id="logout-btn">Lock Screen</button>
    </div>
  </div>
  <div class="main">
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="stat-total">-</div><div class="stat-label">Registrations</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-checked">-</div><div class="stat-label">Checked In</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-pending">-</div><div class="stat-label">Awaiting</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-guests">-</div><div class="stat-label">Total Guests</div></div>
    </div>
    <div class="controls">
      <div class="search-wrap"><span class="search-icon">&#8981;</span><input type="text" id="search-input" placeholder="Search by name or email..."></div>
      <button class="filter-btn active" id="filter-all">All</button>
      <button class="filter-btn" id="filter-pending">Awaiting</button>
      <button class="filter-btn" id="filter-in">Checked In</button>
      <button class="refresh-btn" id="refresh-btn">&#8635;</button>
      <button class="add-btn" id="add-guest-btn">+ Add Guest</button>
    </div>
    <div class="table-wrap">
      <div class="table-head">
        <div class="th">#</div>
        <div class="th">Name</div>
        <div class="th">Email</div>
        <div class="th">Party</div>
        <div class="th">Registered</div>
        <div class="th">Payment</div>
        <div class="th">Actions</div>
      </div>
      <div id="guest-list-body"><div class="loading-state"><div class="big-spinner"></div><p>Loading guests...</p></div></div>
    </div>
    <div class="table-footer">
      <span class="result-count" id="result-count"></span>
      <span class="last-refresh" id="last-refresh"></span>
      <button class="clear-btn" id="clear-btn">Clear All Records</button>
    </div>
  </div>
</div>

<script>
// Paste the URL of your NEW Apps Script deployment here (Deploy → New deployment → Web app URL).
var SCRIPT_URL = "PASTE_NEW_DEPLOYMENT_URL_HERE";

// The passcode is only kept in memory while the dashboard is open. It is checked by the server, never here.
var passcode = null;
var guests = [];
var currentFilter = "all";
var refreshInterval;

document.getElementById("login-btn").addEventListener("click", tryLogin);
document.getElementById("pwd-input").addEventListener("keydown", function(e) { if (e.key === "Enter") tryLogin(); });
document.getElementById("logout-btn").addEventListener("click", logout);
document.getElementById("refresh-btn").addEventListener("click", fetchGuests);
document.getElementById("search-input").addEventListener("input", render);
document.getElementById("filter-all").addEventListener("click", function() { setFilter("all"); });
document.getElementById("filter-pending").addEventListener("click", function() { setFilter("pending"); });
document.getElementById("filter-in").addEventListener("click", function() { setFilter("in"); });
document.getElementById("clear-btn").addEventListener("click", clearAll);
document.getElementById("add-guest-btn").addEventListener("click", function() {
  document.getElementById("add-name").value = "";
  document.getElementById("add-email").value = "";
  document.getElementById("add-phone").value = "";
  document.getElementById("add-name").classList.remove("invalid");
  document.getElementById("add-modal").classList.add("visible");
});
document.getElementById("modal-cancel").addEventListener("click", function() {
  document.getElementById("add-modal").classList.remove("visible");
});
document.getElementById("modal-confirm").addEventListener("click", addGuestManually);
document.getElementById("add-modal").addEventListener("click", function(e) {
  if (e.target === this) this.classList.remove("visible");
});

document.getElementById("guest-list-body").addEventListener("click", function(e) {
  var btn = e.target.closest("button");
  if (!btn) return;
  var id = btn.dataset.id;
  var gid = btn.dataset.gid;
  var ci = btn.dataset.ci;
  var payment = btn.dataset.payment;
  if (btn.classList.contains("checkin-btn") && id) toggleCheckIn(id);
  else if (btn.classList.contains("pay-btn") && id) updatePayment(id, payment);
  else if (btn.classList.contains("remove-btn") && id) removeGuest(id);
  else if (btn.classList.contains("remove-btn") && gid) removeCompanion(gid, parseInt(ci, 10));
});

// Every request carries the passcode; the server rejects anything without the right one.
function api(payload) {
  var body = Object.assign({ passcode: passcode }, payload);
  return fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(body)
  }).then(function(res) { return res.json(); }).then(function(data) {
    if (data && (data.error === "unauthorized" || data.error === "locked") && passcode !== null && document.getElementById("dashboard").classList.contains("visible")) {
      logout();
      showLoginError(data.error === "locked" ? "Too many attempts. Try again in 5 minutes." : "Session ended. Enter the passcode again.");
    }
    return data;
  });
}

function showLoginError(msg) {
  var errEl = document.getElementById("login-error");
  var input = document.getElementById("pwd-input");
  errEl.textContent = msg;
  input.classList.add("invalid");
  errEl.classList.add("show");
  setTimeout(function() { input.classList.remove("invalid"); errEl.classList.remove("show"); }, 3000);
}

function tryLogin() {
  var input = document.getElementById("pwd-input");
  var btn = document.getElementById("login-btn");
  var val = input.value.trim();
  if (!val) return;
  passcode = val;
  btn.disabled = true;
  btn.textContent = "Checking…";
  api({ action: "list" }).then(function(data) {
    if (data && data.success) {
      input.value = "";
      document.getElementById("login-screen").classList.add("hidden");
      document.getElementById("dashboard").classList.add("visible");
      applyGuests(data.guests || []);
      refreshInterval = setInterval(fetchGuests, 30000);
    } else {
      passcode = null;
      input.value = "";
      showLoginError(data && data.error === "locked" ? "Too many attempts. Try again in 5 minutes." : "Incorrect passcode. Please try again.");
    }
  }).catch(function() {
    passcode = null;
    showLoginError("Can't reach the server. Check your connection and try again.");
  }).finally(function() {
    btn.disabled = false;
    btn.textContent = "Unlock Dashboard";
  });
}

function logout() {
  clearInterval(refreshInterval);
  passcode = null;
  guests = [];
  document.getElementById("guest-list-body").innerHTML = "";
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("dashboard").classList.remove("visible");
  document.getElementById("pwd-input").value = "";
}

function applyGuests(data) {
  var localCheckedIds = {};
  guests.forEach(function(g) { if (isCheckedIn(g)) localCheckedIds[String(g.ID)] = true; });
  guests = data;
  guests.forEach(function(g) { if (localCheckedIds[String(g.ID)]) g["Checked In"] = "TRUE"; });
  render();
  updateStats();
  document.getElementById("last-refresh").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});
}

function fetchGuests() {
  if (passcode === null) return;
  var btn = document.getElementById("refresh-btn");
  btn.classList.add("spinning");
  api({ action: "list" })
    .then(function(data) { if (data && data.success) applyGuests(data.guests || []); })
    .catch(function() { document.getElementById("last-refresh").textContent = "Failed to refresh"; })
    .finally(function() { setTimeout(function() { btn.classList.remove("spinning"); }, 600); });
}

function toggleCheckIn(id) {
  var g = guests.find(function(g) { return String(g.ID) === String(id); });
  if (!g) return;
  var newVal = !isCheckedIn(g);
  g["Checked In"] = newVal ? "TRUE" : "FALSE";
  render();
  updateStats();
  api({ action: "checkIn", id: String(id), checkedIn: newVal }).catch(function() {});
}

function updatePayment(id, current) {
  var states = ["unpaid", "cash", "card"];
  var next = states[(states.indexOf(current) + 1) % states.length];
  var g = guests.find(function(g) { return String(g.ID) === String(id); });
  if (g) g["Payment"] = next;
  render();
  api({ action: "updatePayment", id: String(id), payment: next }).catch(function() {});
}

function removeGuest(id) {
  if (!confirm("Remove this guest from the list?")) return;
  guests = guests.filter(function(g) { return String(g.ID) !== String(id); });
  render();
  updateStats();
  api({ action: "removeGuest", id: String(id) }).then(function() { setTimeout(fetchGuests, 1500); }).catch(function() {});
}

function removeCompanion(guestId, companionIndex) {
  if (!confirm("Remove this companion?")) return;
  var g = guests.find(function(g) { return String(g.ID) === String(guestId); });
  if (g) {
    var companions = parseCompanions(g);
    companions.splice(companionIndex, 1);
    g["Companions"] = JSON.stringify(companions);
    g["Party Size"] = companions.length + 1;
  }
  render();
  updateStats();
  api({ action: "removeCompanion", guestId: String(guestId), companionIndex: companionIndex }).then(function() { setTimeout(fetchGuests, 1500); }).catch(function() {});
}

function isCheckedIn(g) { var v = g["Checked In"]; return v === true || v === "TRUE" || v === "true" || v === 1 || v === "1"; }
function getPartySize(g) { var v = parseInt(g["Party Size"], 10); return (!isNaN(v) && v > 0) ? v : (parseCompanions(g).length + 1); }
function parseCompanions(g) { try { var r = g["Companions"] || g["companions"] || ""; if (!r) return []; return typeof r === "string" ? JSON.parse(r) : r; } catch(e) { return []; } }
function setFilter(f) { currentFilter = f; ["all","pending","in"].forEach(function(k) { document.getElementById("filter-" + k).classList.toggle("active", k === f); }); render(); }

function updateStats() {
  var checked = guests.filter(isCheckedIn).length;
  var total = guests.reduce(function(s, g) { return s + getPartySize(g); }, 0);
  document.getElementById("stat-total").textContent = guests.length;
  document.getElementById("stat-checked").textContent = checked;
  document.getElementById("stat-pending").textContent = guests.length - checked;
  document.getElementById("stat-guests").textContent = total;
}

function render() {
  var q = document.getElementById("search-input").value.toLowerCase();
  var filtered = guests.filter(function(g) {
    var matchQ = !q || String(g.Name||"").toLowerCase().indexOf(q) >= 0 || String(g.Email||"").toLowerCase().indexOf(q) >= 0;
    var matchF = currentFilter === "all" || (currentFilter === "in" && isCheckedIn(g)) || (currentFilter === "pending" && !isCheckedIn(g));
    return matchQ && matchF;
  });

  document.getElementById("result-count").textContent = filtered.length === 0 ? "" :
    "Showing " + filtered.length + " of " + guests.length + " registration" + (guests.length !== 1 ? "s" : "");

  var body = document.getElementById("guest-list-body");
  if (guests.length === 0) { body.innerHTML = "<div class=\"empty-state\"><div class=\"empty-icon\">*</div><p>No registrations yet</p></div>"; return; }
  if (filtered.length === 0) { body.innerHTML = "<div class=\"empty-state\"><div class=\"empty-icon\">*</div><p>No results match your search</p></div>"; return; }

  var html = "";
  for (var i = 0; i < filtered.length; i++) {
    var g = filtered[i];
    var checkedIn = isCheckedIn(g);
    var party = getPartySize(g);
    var companions = parseCompanions(g);
    var partyLabel = party === 1 ? "1 guest" : party + " guests";
    var gid = escHtml(String(g.ID));
    var payment = ["unpaid","cash","card"].indexOf(g["Payment"]) >= 0 ? g["Payment"] : "unpaid";
    var payLabel = payment === "cash" ? "Cash" : payment === "card" ? "Card" : "Unpaid";
    var ticket = g["Ticket"] ? " · " + escHtml(g["Ticket"]) : "";

    html += "<div class=\"guest-row" + (checkedIn ? " checked-in" : "") + "\">";
    html += "<div class=\"guest-main\">";
    html += "<span class=\"row-num\">" + (i + 1) + "</span>";
    html += "<span class=\"guest-name\">" + escHtml(g.Name || "-") + "</span>";
    html += "<span class=\"guest-email\">" + escHtml(g.Email || "-") + "</span>";
    html += "<span class=\"guest-party-size\">" + partyLabel + ticket + "</span>";
    html += "<span class=\"guest-time\">" + escHtml(g["Registered At"] || "-") + "</span>";
    html += "<button class=\"pay-btn " + payment + "\" data-id=\"" + gid + "\" data-payment=\"" + payment + "\">" + payLabel + "</button>";
    html += "<div class=\"guest-actions\">";
    html += "<button class=\"checkin-btn" + (checkedIn ? " in" : "") + "\" data-id=\"" + gid + "\">" + (checkedIn ? "Checked In" : "Check In") + "</button>";
    html += "<button class=\"remove-btn\" data-id=\"" + gid + "\" aria-label=\"Remove guest\">X</button>";
    html += "</div></div>";

    if (companions.length > 0) {
      html += "<div class=\"companions-list\">";
      for (var ci = 0; ci < companions.length; ci++) {
        var c = companions[ci];
        html += "<div class=\"companion-item\">";
        html += "<div class=\"companion-dot\"></div>";
        html += "<span class=\"companion-name\">" + escHtml(c.name || "-") + "</span>";
        html += "<span class=\"companion-email\">" + escHtml(c.email || "-") + "</span>";
        html += "<button class=\"remove-btn\" data-gid=\"" + gid + "\" data-ci=\"" + ci + "\" aria-label=\"Remove companion\" style=\"margin-left:auto;\">X</button>";
        html += "</div>";
      }
      html += "</div>";
    }
    html += "</div>";
  }
  body.innerHTML = html;
}

function clearAll() {
  if (!confirm("Permanently delete all guest records? This cannot be undone.")) return;
  api({ action: "clearAll" }).then(function(data) {
    if (data && data.success) { guests = []; render(); updateStats(); }
    else alert("Couldn't delete the records. Try again.");
  }).catch(function() { alert("Couldn't reach the server. Try again."); });
}

function addGuestManually() {
  var name = document.getElementById("add-name").value.trim();
  var email = document.getElementById("add-email").value.trim();
  var phone = document.getElementById("add-phone").value.trim();
  var nameInput = document.getElementById("add-name");
  if (!name || name.length < 2) { nameInput.classList.add("invalid"); return; }
  nameInput.classList.remove("invalid");
  document.getElementById("add-modal").classList.remove("visible");
  api({ action: "addGuest", guest: { name: name, email: email, phone: phone } }).then(function(data) {
    if (data && data.success) fetchGuests();
    else if (data && data.error === "duplicate") alert("This email is already on the list.");
    else alert("Couldn't add the guest. Check the email and phone format.");
  }).catch(function() { alert("Couldn't reach the server. Try again."); });
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
</script>


<div class="modal-overlay" id="add-modal">
  <div class="modal">
    <div class="modal-title">Add Guest Manually</div>
    <div class="modal-sub">Add a walk-in guest to the list</div>
    <div class="field">
      <label>Full Name *</label>
      <input type="text" id="add-name" placeholder="First and last name">
    </div>
    <div class="field">
      <label>Email Address</label>
      <input type="email" id="add-email" placeholder="guest@email.com">
    </div>
    <div class="field">
      <label>Phone Number</label>
      <input type="tel" id="add-phone" placeholder="+352 000 000 000">
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="modal-cancel">Cancel</button>
      <button class="modal-confirm" id="modal-confirm">Add to List</button>
    </div>
  </div>
</div>
</body>
</html>
