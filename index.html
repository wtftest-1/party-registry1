<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WTF(x)? — Back soon</title>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000; --paper:#fff; --gold:#b8913a; --muted:#5c5c5c; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:'Montserrat', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:32px 24px; text-align:center;
  }
  main { max-width:460px; }
  img { width:min(240px, 60vw); height:auto; margin-bottom:40px; }
  h1 {
    font-family:'Abril Fatface', Georgia, serif; font-weight:400;
    font-size:clamp(2rem, 7vw, 2.75rem); line-height:1.1; margin-bottom:20px;
  }
  .rule { width:48px; height:2px; background:var(--gold); margin:0 auto 20px; }
  p { color:var(--muted); font-size:1rem; line-height:1.6; }
  p + p { margin-top:12px; }
  a { color:var(--ink); text-underline-offset:3px; }
  a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="https://i.imgur.com/1n4A9HH.png" alt="WTF(x)? — Where tha function?">
  <h1>Registration is paused</h1>
  <div class="rule" aria-hidden="true"></div>
  <p>We're making some improvements to the registration system. It will be back shortly.</p>
  <p>Already registered? Your spot is still saved. For any question, write to <a href="mailto:customerservice@wtfx.lu">customerservice@wtfx.lu</a>.</p>
</main>
</body>
</html>
